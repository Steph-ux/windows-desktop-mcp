[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "windows-desktop-mcp"
version = "0.2.0"
description = "Windows desktop and browser control MCP server - 19 super-tools for automation, OCR, Playwright, video recording, social DOM extraction, workflows, and persistent goals."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "Steph-ux"},
]
keywords = ["mcp", "desktop", "automation", "playwright", "ocr", "windows", "browser", "workflow", "goals"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Systems Administration",
]

dependencies = [
    "mcp[cli]>=1.27.0",
    "mss>=10.1.0",
    "Pillow>=11.2.0",
    "playwright>=1.52.0",
    "pytesseract>=0.3.13",
    "pyautogui>=0.9.54",
    "pywinauto>=0.6.8",
    "httpx>=0.28.0",
    "opencv-python-headless<4.10.0",
    "numpy<2.0.0",
    "psutil>=5.9.0",
    "pywin32>=306",
    "nest-asyncio>=1.6.0",
    "selenium>=4.20.0",
    "anyio>=4.0.0",
    "websocket-client>=1.8.0",
    "cloakbrowser>=0.3.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
    "pytest-mock>=3.12",
]

[project.urls]
Homepage = "https://github.com/Steph-ux/windows-desktop-mcp"
Repository = "https://github.com/Steph-ux/windows-desktop-mcp"
Issues = "https://github.com/Steph-ux/windows-desktop-mcp/issues"

[project.scripts]
windows-desktop-mcp = "desktop_mcp.server:main"
desktop-mcp-dashboard = "desktop_mcp.dashboard:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["desktop_mcp*"]

[tool.setuptools.package-data]
desktop_mcp = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
