[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "windows-desktop-mcp"
version = "0.1.0"
description = "Windows desktop and browser control MCP server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.27.0",
    "mss>=10.1.0",
    "Pillow>=11.2.0",
    "playwright>=1.52.0",
    "pytesseract>=0.3.13",
    "pyautogui>=0.9.54",
    "pywinauto>=0.6.8",
    "httpx>=0.28.0",
    "opencv-python-headless>=4.10.0.84",
]

[project.scripts]
windows-desktop-mcp = "desktop_mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["desktop_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
